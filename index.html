<!DOCTYPE html>
<html lang="cs">
<head>
 <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI projekt – Nemovitosti</title>
 
<link rel="stylesheet" href="style.css">
 
<!-- moderní font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">
</head>
 
<body>
 
<div class="container">
 
    <h1>🏠 AI – Predikce cen nemovitostí</h1>
 
    <p class="subtitle">
        Odhad ceny pomocí jednoduchého modelu strojového učení
    </p>
 
    <h2>🔢 Vyzkoušej predikci</h2>
 
    <div class="input-box">
        <label>Velikost (m²)</label>
        <input type="number" id="size" placeholder="Např. 75">
    </div>
 
    <div class="input-box">
        <label>Počet pokojů</label>
        <input type="number" id="rooms" placeholder="Např. 3">
    </div>
 
    <div class="input-box">
        <label>Stáří (roky)</label>
        <input type="number" id="age" placeholder="Např. 10">
    </div>

    <!-- 🆕 NOVÉ: lokalita -->
    <div class="input-box">
        <label>Lokalita</label>
        <select id="location">
            <option value="praha">Praha</option>
            <option value="city">Větší město</option>
            <option value="village">Menší město / vesnice</option>
        </select>
    </div>
 
    <button onclick="predict()">🔮 Spočítat cenu</button>
 
    <h2 id="result" class="result"></h2>
 
    <div class="info">
        <h3>📊 Jak to funguje?</h3>
        <p>
            Model využívá princip lineární regrese a odhaduje cenu na základě velikosti,
            počtu pokojů, stáří a lokality nemovitosti.
        </p>
    </div>
 
</div>
 
<script src="script.js"></script>
</body>
</html>
