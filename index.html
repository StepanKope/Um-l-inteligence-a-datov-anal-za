<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI projekt – Nemovitosti</title>

<link rel="stylesheet" href="style.css">

<!-- font -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&display=swap" rel="stylesheet">

<!-- graf -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

<div class="container">

    <div class="left">
        <h1>🏠 AI – Predikce cen nemovitostí</h1>

        <p class="subtitle">
            Odhad ceny pomocí jednoduchého modelu strojového učení
        </p>

        <h2>🔢 Vyzkoušej predikci</h2>

        <div class="input-box">
            <label>Velikost (m²)</label>
            <input type="number" id="size">
        </div>

        <div class="input-box">
            <label>Počet pokojů</label>
            <input type="number" id="rooms">
        </div>

        <div class="input-box">
            <label>Stáří (roky)</label>
            <input type="number" id="age">
        </div>

        <div class="input-box">
            <label>Lokalita</label>
            <select id="location">
                <option value="praha">Praha</option>
                <option value="city">Větší město</option>
                <option value="village">Menší město</option>
            </select>
        </div>

        <button onclick="predict()">🔮 Spočítat cenu</button>

        <h2 id="result" class="result"></h2>
    </div>

    <div class="right">
        <canvas id="priceChart"></canvas>
    </div>

</div>

<script src="script.js"></script>
</body>
</html>
